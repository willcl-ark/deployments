creation_rules:
  # Keep the old DNS seed recipient until its retirement is confirmed.
  # Detached public signatures are deliberately not SOPS files.
  - path_regex: ^secrets/nero/(secrets\.yaml|dnssec/.*|guix/(signing-key\.(pub|sec)|nero-to-guix-publish-2))$
    key_groups:
      - pgp: [*yubikey]
        age: [*will, *old_dnsseed, *nero]
  - path_regex: ^secrets/beelink/.*\.yaml$
    key_groups:
      - pgp: [*yubikey]
        age: [*beelink]
  - path_regex: ^secrets/fish-foo/.*\.yaml$
    key_groups:
      - age: [*will, *fish_foo]
  - path_regex: ^secrets/kestrel/.*\.sops\.yaml$
    key_groups:
      - age: [*will, *cdash]
  - path_regex: ^secrets/guix-publish-2/signing-key\.(pub|sec)$
    key_groups:
      - pgp: [*yubikey]
        age: [*will, *guix_publish_2]
