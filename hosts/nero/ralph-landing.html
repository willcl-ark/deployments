<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ralph</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js" defer></script>
<style>
body { font: 18px system-ui, sans-serif; max-width: 32rem; margin: 15vh auto; padding: 0 1.5rem; color: var(--text); background: var(--bg); }
h1 { margin-bottom: 2rem; }
nav { display: grid; gap: 1rem; }
a { display: block; padding: 1.25rem; border: 1px solid var(--border); border-radius: .5rem; color: var(--accent); background: var(--surface); text-decoration: none; }
a:hover, a:focus-visible { border-color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<button type="button" data-theme-toggle hidden>Switch theme</button>
<h1>Ralph</h1>
<nav aria-label="Ralph">
<a href="https://review.fish.foo/stats/">Stats</a>
<a href="https://review.fish.foo/traces/">Reviews</a>
</nav>
</body>
</html>
